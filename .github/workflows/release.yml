name: Release

on:
  push:
    tags: ['v*']

jobs:
  build_cli:
    name: CLI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: tapkee-linux-x86_64
            binary: bin/tapkee
          - name: macOS
            os: macos-latest
            artifact: tapkee-macos-arm64
            binary: bin/tapkee
          - name: Windows
            os: windows-latest
            artifact: tapkee-windows-x86_64
            binary: bin/Release/tapkee.exe

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libarpack2-dev libfmt-dev libcxxopts-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install arpack eigen fmt cxxopts

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        channels: conda-forge

    - name: Install conda packages (Windows)
      if: runner.os == 'Windows'
      run: conda install eigen fmt cxxopts

    - name: Build
      run: |
        cmake -B build -DBUILD_CLI=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Package
      shell: bash
      run: |
        mkdir -p staging
        cp ${{ matrix.binary }} staging/
        cp LICENSE staging/
        cd staging && tar czf ../${{ matrix.artifact }}.tar.gz *

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}.tar.gz

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build sdist
      run: |
        cp -rL packages/python .sdist-work
        cd .sdist-work && pipx run build --sdist -o ../dist
        rm -rf .sdist-work

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  build_wheels:
    name: Wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            arch: x86_64
          - name: macOS
            os: macos-26-arm64
            arch: arm64
            macos_target: "26.0"
          - name: Windows
            os: windows-latest
            arch: AMD64

    steps:
    - uses: actions/checkout@v7

    - name: Set up vcpkg cache
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: C:\vcpkg\installed
        key: vcpkg-${{ matrix.arch }}-${{ hashFiles('packages/python/pyproject.toml') }}

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2
      with:
        package-dir: packages/python
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}"

    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.name }}
        path: ./wheelhouse/*.whl

  build_js:
    name: Build wasm module
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: sudo apt-get install -y libeigen3-dev

    # Ubuntu's libfmt-dev advertises /usr/include as its interface include
    # directory, which would drag the host glibc headers into the wasm compile
    - name: Install fmt
      run: |
        git clone --depth 1 --branch 12.2.0 https://github.com/fmtlib/fmt.git
        cmake -B fmt/build -S fmt -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_INSTALL_PREFIX=$HOME/fmt-install
        cmake --build fmt/build --target install -j

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14

    # GPL_FREE excludes the LGPLv3 CoverTree so the published package stays
    # BSD-3-Clause; VpTree remains available via neighborsMethod: 'vptree'
    - name: Build
      run: >
        emcmake cmake -B build
        -DBUILD_JS=ON -DBUILD_CLI=OFF -DGPL_FREE=ON
        -DCMAKE_DISABLE_FIND_PACKAGE_Arpack=TRUE
        -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE
        -DCMAKE_DISABLE_FIND_PACKAGE_OpenCL=TRUE
        -Dfmt_DIR=$HOME/fmt-install/lib/cmake/fmt
        && cmake --build build --target tapkee_js

    - name: Test
      run: node test/javascript/smoke.js

    - name: Package
      run: |
        mkdir -p packages/js/dist
        cp bin/tapkee.js bin/tapkee.wasm packages/js/dist/
        cp LICENSE packages/js/
        tar czf tapkee-js.tar.gz -C packages/js .

    - uses: actions/upload-artifact@v7
      with:
        name: tapkee-js
        path: tapkee-js.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '{sdist,wheels-*}'
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1

  publish_npm:
    name: Publish to npm
    needs: build_js
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: tapkee-js

    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    - name: Unpack package
      run: mkdir -p package && tar xzf tapkee-js.tar.gz -C package

    - name: Set version from tag
      working-directory: package
      run: npm --no-git-tag-version --allow-same-version version "${GITHUB_REF_NAME#v}"

    - name: Publish
      working-directory: package
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "NPM_TOKEN secret is not set, skipping npm publish"
          exit 0
        fi
        npm publish --provenance --access public

  release:
    name: GitHub Release
    needs: [build_cli, build_sdist, build_wheels, build_js]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
